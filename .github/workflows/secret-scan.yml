name: Security Scanning

# Run on pull requests and pushes to main branch
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger

jobs:
  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for better secret detection
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install detect-secrets
        run: |
          pip install detect-secrets
      
      - name: Run detect-secrets scan
        run: |
          # Scan for secrets in the codebase
          # Exclude common false positives and test files
          detect-secrets scan \
            --exclude-files '\.git/.*' \
            --exclude-files '\.secrets\.baseline' \
            --exclude-files 'package-lock\.json' \
            --exclude-files 'node_modules/.*' \
            --exclude-files '\.env\.example' \
            > .secrets.baseline.new
          
          # If baseline exists, compare against it
          if [ -f .secrets.baseline ]; then
            echo "Comparing against existing baseline..."
            detect-secrets audit .secrets.baseline.new
          else
            echo "No baseline found, checking for any secrets..."
            # Fail if any secrets are found
            secret_count=$(cat .secrets.baseline.new | grep -c '"hashed_secret"' || echo "0")
            if [ "$secret_count" -gt "0" ]; then
              echo "❌ Found $secret_count potential secret(s)!"
              echo "Review the findings:"
              cat .secrets.baseline.new
              echo ""
              echo "If these are false positives, add them to .secrets.baseline"
              exit 1
            else
              echo "✅ No secrets detected!"
            fi
          fi
      
      - name: Check for hardcoded API keys
        run: |
          echo "Checking for common API key patterns..."
          
          # Check for Google API keys
          if git grep -i "AIzaSy" -- '*.ts' '*.tsx' '*.js' '*.jsx' '*.py' '*.java' 2>/dev/null; then
            echo "❌ Found potential Google API key in code!"
            exit 1
          fi
          
          # Check for generic API key patterns
          if git grep -E "api[_-]?key.*=.*['\"][a-zA-Z0-9]{20,}['\"]" -i -- '*.ts' '*.tsx' '*.js' '*.jsx' 2>/dev/null | grep -v "YOUR_.*_KEY_HERE" | grep -v "example"; then
            echo "❌ Found potential hardcoded API key!"
            exit 1
          fi
          
          echo "✅ No hardcoded API keys found in source files!"

  dependency-scanning:
    name: Dependency Scanning
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run npm audit
        run: |
          echo "Running npm audit..."
          # Run audit and capture output
          npm audit --audit-level=moderate || audit_failed=true
          
          if [ "$audit_failed" = "true" ]; then
            echo ""
            echo "❌ npm audit found vulnerabilities!"
            echo "Run 'npm audit fix' to fix automatically fixable issues."
            echo "Review 'npm audit' output for manual fixes."
            exit 1
          fi
          
          echo "✅ No known vulnerabilities found!"
      
      - name: Check for outdated dependencies
        run: |
          echo "Checking for outdated dependencies..."
          npm outdated || true
          echo "ℹ️  Review outdated dependencies above"

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Check TypeScript
        run: |
          echo "Running TypeScript type checking..."
          npx tsc --noEmit || {
            echo "❌ TypeScript errors found!"
            exit 1
          }
          echo "✅ TypeScript check passed!"
      
      - name: Check for console.log statements
        run: |
          echo "Checking for debug console statements..."
          # Allow console.warn and console.error, but flag console.log in production code
          if git grep "console\.log" -- '*.ts' '*.tsx' '*.js' '*.jsx' | grep -v "// TODO" | grep -v "test" | grep -v "spec"; then
            echo "⚠️  Found console.log statements. Consider removing for production."
            # Don't fail, just warn
          else
            echo "✅ No console.log statements found!"
          fi

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [secret-scanning, dependency-scanning, code-quality]
    if: always()
    
    steps:
      - name: Summary
        run: |
          echo "## Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.secret-scanning.result }}" = "success" ]; then
            echo "✅ **Secret Scanning**: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Secret Scanning**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.dependency-scanning.result }}" = "success" ]; then
            echo "✅ **Dependency Scanning**: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Dependency Scanning**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.code-quality.result }}" = "success" ]; then
            echo "✅ **Code Quality**: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Code Quality**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
